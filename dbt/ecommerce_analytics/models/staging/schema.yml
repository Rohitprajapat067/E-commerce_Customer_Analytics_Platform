version: 2

sources:
  - name: raw
    schema: raw
    description: Bronze layer, loaded by the Python ETL (etl/run_etl.py)
    tables:
      - name: customers
      - name: products
      - name: orders
      - name: order_items
      - name: date_dim

models:
  - name: stg_customers
    description: Cleaned customer records (Silver layer).
    columns:
      - name: customer_id
        description: Primary key.
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]

  - name: stg_products
    description: Cleaned product catalog with computed margin.
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_orders
    description: Cleaned order headers.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['completed', 'cancelled', 'returned']

  - name: stg_order_items
    description: Cleaned order line items with computed line revenue.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests:
          - not_null
