name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api/requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: ruff check etl api tests --output-format=github

      - name: Generate sample data
        run: python data/generate_sample_data.py

      - name: Run unit tests
        run: pytest tests/ -v
